<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Elyseum — CI quality ledger">
  <!-- charcoal field -->
  <rect width="1200" height="280" fill="#1A1A1C"/>
  <!-- mist panel, cut slant at the top-left corner -->
  <path d="M720 0 H1200 V280 H660 V96 Z" fill="#F4F3F0"/>
  <!-- seal: the app mark (circle + diamond + survey ticks + center dot) at 4.5x, ink on mist -->
  <g transform="translate(928 68) scale(4.5)" stroke="#1A1A1C" stroke-width="0.75" fill="none">
    <circle cx="16" cy="16" r="13.5"/>
    <rect x="9.5" y="9.5" width="13" height="13" transform="rotate(45 16 16)"/>
    <path d="M16 1v4M16 27v4M1 16h4M27 16h4"/>
    <circle cx="16" cy="16" r="1.5" fill="#1A1A1C" stroke="none"/>
  </g>
  <!-- wordmark: thin serif caps with the mid-letter strike rule, platinum on charcoal -->
  <text x="120" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="88" fill="#F4F3F0" textLength="512" lengthAdjust="spacingAndGlyphs">ELYSEUM</text>
  <line x1="124" y1="141" x2="644" y2="141" stroke="#F4F3F0" stroke-width="3" opacity="0.9"/>
  <!-- tagline -->
  <text x="120" y="216" font-family="'Courier New', monospace" font-size="24" letter-spacing="6" fill="#A5A19A">- CI QUALITY LEDGER -</text>
  <!-- bracket tags -->
  <text x="120" y="252" font-family="'Courier New', monospace" font-size="24" fill="#A5A19A">[RUN]&#160;&#160;&#160;[COVERAGE]&#160;&#160;&#160;[BUILD]</text>
</svg>
