name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Script unit tests
        run: bash tests/scripts.test.sh

      - name: Validate action metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import yaml, sys
          doc = yaml.safe_load(open('action.yml'))
          assert doc['runs']['using'] == 'composite', 'must be a composite action'
          inputs = doc['inputs']
          for required in ['github_token', 'github_token_actor', 'command', 'comment-name', 'workdir', 'result-file-path', 'annotation-file-path', 'quality-gate', 'quality-gate-fail', 'elyseum-cli-version']:
              assert required in inputs, f'missing input: {required}'
          node_version = None
          for step in doc['runs']['steps']:
              uses = step.get('uses', '')
              if uses.startswith('actions/setup-node'):
                  node_version = step['with']['node-version']
          assert node_version == '20', f'setup-node version must be 20, got {node_version}'
          print('action.yml metadata OK')
          "
