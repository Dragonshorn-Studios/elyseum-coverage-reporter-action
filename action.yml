name: "Elyseum Coverage Reporter"
description: >-
  Runs a pinned version of elyseum-cli against your repository and publishes
  one idempotent PR comment plus one quality-gate check run, and optionally
  uploads the v1 result envelope to an Elyseum server.
#
# Minimum permissions for the consuming workflow:
#   contents: read, pull-requests: write, checks: write
# (composite actions cannot declare permissions; see README example)
inputs:
  github_token:
    description: "GitHub API access token."
    default: ${{ github.token }}
    required: false
  github_token_actor:
    description: >-
      Login of the actor that owns github_token (e.g. "github-actions[bot]"
      for the default token, or the GitHub App slug for App installation
      tokens). Used to find the comment created by earlier runs of this
      action so it is updated in place.
    default: "github-actions[bot]"
    required: false
  command:
    description: "elyseum-cli command to run (diff-coverage or coverage)."
    default: "diff-coverage"
    required: false
  comment-name:
    description: "Identifying name of the PR comment to update or create."
    default: "Elyseum Coverage Reporter"
    required: false
  workdir:
    description: "Working directory to run elyseum-cli in."
    default: "."
    required: false
  result-file-path:
    description: "PR comment markdown file produced by the CLI reporter."
    default: "coverage/github.pr.coverage.md"
    required: false
  annotation-file-path:
    description: "Check-run annotations JSON file produced by the CLI reporter."
    default: "coverage/github.pr.annotations.json"
    required: false
  quality-gate:
    description: "Changed-line coverage percentage below which the gate warns."
    default: "80"
    required: false
  quality-gate-fail:
    description: "Changed-line coverage percentage below which the gate fails (exit 1)."
    default: "15"
    required: false
  elyseum-cli-version:
    description: "Pinned elyseum-cli version to install from npm."
    default: "1.0.12"
    required: false
  use-dev-elyseum-cli:
    description: "Git ref of Dragonshorn-Studios/elyseum-cli to install instead of the pinned npm version (for CLI development)."
    default: ""
    required: false
  elyseum-server:
    description: "Elyseum server origin (e.g. https://elyseum.example.com). Upload is disabled when empty."
    default: ""
    required: false
  elyseum-project-slug:
    description: "Project slug on the Elyseum server."
    default: ""
    required: false
  elyseum-ingest-token:
    description: "Project-scoped ingest token (GitHub Secrets). Never logged or echoed."
    default: ""
    required: false
  elyseum-strict-upload:
    description: "When true, an upload failure fails the Action; otherwise it produces a ::warning."
    default: "false"
    required: false
  envelope-path:
    description: "Path (relative to workdir) where the v1 result envelope is written before upload."
    default: "envelope.json"
    required: false
  envelope-tests-format:
    description: "Test report format for the envelope: vitest-json | junit | go-test-json. Requires envelope-tests-input."
    default: ""
    required: false
  envelope-tests-input:
    description: "Test report path for the envelope. Requires envelope-tests-format."
    default: ""
    required: false
  envelope-coverage-format:
    description: "Coverage report format for the envelope: lcov | clover | go-coverprofile. Requires envelope-coverage-input."
    default: ""
    required: false
  envelope-coverage-input:
    description: "Coverage report path for the envelope. Requires envelope-coverage-format."
    default: ""
    required: false
runs:
  using: "composite"
  steps:
    - name: Guard supported event
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/scripts/guard-event.sh"

    - name: Validate inputs
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        QUALITY_GATE: ${{ inputs.quality-gate }}
        QUALITY_GATE_FAIL: ${{ inputs.quality-gate-fail }}
        WORKDIR: ${{ inputs.workdir }}
        ENVELOPE_TESTS_FORMAT: ${{ inputs.envelope-tests-format }}
        ENVELOPE_TESTS_INPUT: ${{ inputs.envelope-tests-input }}
        ENVELOPE_COVERAGE_FORMAT: ${{ inputs.envelope-coverage-format }}
        ENVELOPE_COVERAGE_INPUT: ${{ inputs.envelope-coverage-input }}
        PROJECT_SLUG: ${{ inputs.elyseum-project-slug }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/scripts/validate-inputs.sh"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install elyseum-cli (pinned)
      if: ${{ inputs.use-dev-elyseum-cli == '' }}
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.elyseum-cli-version }}
      run: npm install -g "@dragonshorn-studios/elyseum-cli@$CLI_VERSION"

    - name: Install elyseum-cli from source
      if: ${{ inputs.use-dev-elyseum-cli != '' }}
      shell: bash
      env:
        CLI_REF: ${{ inputs.use-dev-elyseum-cli }}
      run: |
        git clone --depth 1 --branch "$CLI_REF" https://github.com/Dragonshorn-Studios/elyseum-cli.git /tmp/elyseum-cli
        cd /tmp/elyseum-cli
        npm install
        npm run build
        npm install -g .

    - name: Run elyseum-cli
      id: cli
      shell: bash
      continue-on-error: true
      working-directory: ${{ inputs.workdir }}
      env:
        COMMAND: ${{ inputs.command }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_NAME: ${{ inputs.comment-name }}
        RESULT_FILE_PATH: ${{ inputs.result-file-path }}
        ANNOTATION_FILE_PATH: ${{ inputs.annotation-file-path }}
        QUALITY_GATE: ${{ inputs.quality-gate }}
        QUALITY_GATE_FAIL: ${{ inputs.quality-gate-fail }}
      run: |
        # set +e: the CLI's exit code is captured as data (1 = failed gate);
        # the Fail on quality-gate failure step enforces it afterwards.
        set +e
        elyseum-cli "$COMMAND" \
          --reporter.coverage github-pr-comment \
          --reporter.coverage.github-pr-comment.comment-name "$COMMENT_NAME" \
          --reporter.coverage.github-pr-comment.comment-file-path "$RESULT_FILE_PATH" \
          --reporter.coverage.github-pr-comment.annotation-file-path "$ANNOTATION_FILE_PATH" \
          --reporter.coverage.github-pr-comment.create-annotations \
          --reporter.coverage.github-pr-comment.quality-gate "$QUALITY_GATE" \
          --reporter.coverage.github-pr-comment.quality-gate-fail "$QUALITY_GATE_FAIL"
        cli_exit=$?
        echo "exit-code=$cli_exit" >> "$GITHUB_OUTPUT"
        exit "$cli_exit"

    - name: Verify CLI outputs
      shell: bash
      env:
        WORKDIR: ${{ inputs.workdir }}
        RESULT_FILE_PATH: ${{ inputs.result-file-path }}
        ANNOTATION_FILE_PATH: ${{ inputs.annotation-file-path }}
        CLI_EXIT_CODE: ${{ steps.cli.outputs.exit-code }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/scripts/verify-outputs.sh"

    - name: Parse annotations
      id: parse-annotations
      shell: bash
      env:
        WORKDIR: ${{ inputs.workdir }}
        ANNOTATION_FILE_PATH: ${{ inputs.annotation-file-path }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/scripts/parse-annotations.sh" "$WORKDIR/$ANNOTATION_FILE_PATH"

    - name: Find comment
      uses: peter-evans/find-comment@v3
      id: find-comment
      with:
        token: ${{ inputs.github_token }}
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: ${{ inputs.github_token_actor }}
        body-includes: ${{ inputs.comment-name }}

    - name: Create or update comment
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ inputs.github_token }}
        comment-id: ${{ steps.find-comment.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        body-path: ${{ inputs.workdir }}/${{ inputs.result-file-path }}
        edit-mode: replace

    - name: Update check run
      uses: LouisBrunner/checks-action@v2.0.0
      with:
        token: ${{ inputs.github_token }}
        conclusion: ${{ steps.parse-annotations.outputs.conclusion }}
        status: ${{ steps.parse-annotations.outputs.status }}
        name: Elyseum Quality Gate
        output: ${{ steps.parse-annotations.outputs.check-output }}
        output_text_description_file: ${{ inputs.workdir }}/${{ inputs.result-file-path }}
        annotations: ${{ steps.parse-annotations.outputs.annotations }}

    - name: Emit envelope
      id: emit
      if: ${{ inputs.elyseum-server != '' }}
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        ENVELOPE_PATH: ${{ inputs.envelope-path }}
        TESTS_FORMAT: ${{ inputs.envelope-tests-format }}
        TESTS_INPUT: ${{ inputs.envelope-tests-input }}
        COVERAGE_FORMAT: ${{ inputs.envelope-coverage-format }}
        COVERAGE_INPUT: ${{ inputs.envelope-coverage-input }}
        # Map the check-run conclusion onto the envelope's gate vocabulary.
        CHECK_CONCLUSION: ${{ steps.parse-annotations.outputs.conclusion }}
        # The CLI's run identity comes from these runner-provided vars;
        # passed explicitly so the envelope's identity inputs are visible
        # here rather than implicit in the runner environment.
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_JOB: ${{ github.job }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        case "$CHECK_CONCLUSION" in
          success) gate_conclusion="passed" ;;
          failure) gate_conclusion="failed" ;;
          *) gate_conclusion="unknown" ;;
        esac
        args=(emit-envelope
          --emit-envelope.out "$ENVELOPE_PATH"
          --emit-envelope.quality-gate-conclusion "$gate_conclusion")
        if [ -n "$TESTS_FORMAT" ]; then
          args+=(--emit-envelope.tests-format "$TESTS_FORMAT" --emit-envelope.tests-input "$TESTS_INPUT")
        fi
        if [ -n "$COVERAGE_FORMAT" ]; then
          args+=(--emit-envelope.coverage-format "$COVERAGE_FORMAT" --emit-envelope.coverage-input "$COVERAGE_INPUT")
        fi
        # set +e: emission failure is an upload-path failure (warned or
        # enforced by the next step), distinct from the quality-gate verdict.
        set +e
        elyseum-cli "${args[@]}"
        cli_exit=$?
        echo "exit-code=$cli_exit" >> "$GITHUB_OUTPUT"
        exit "$cli_exit"

    - name: Enforce envelope emission
      if: ${{ steps.emit.outcome == 'failure' }}
      shell: bash
      env:
        STRICT_MODE: ${{ inputs.elyseum-strict-upload }}
        EMIT_EXIT_CODE: ${{ steps.emit.outputs.exit-code }}
      run: |
        if [ "$STRICT_MODE" = "true" ]; then
          echo "::error::Envelope emission failed (elyseum-cli exit $EMIT_EXIT_CODE); strict upload is enabled. See the 'Emit envelope' step."
          exit 1
        fi
        echo "::warning::Envelope emission failed (elyseum-cli exit $EMIT_EXIT_CODE); skipping the Elyseum upload. Set elyseum-strict-upload to fail the run instead."

    - name: Upload envelope to Elyseum
      if: ${{ steps.emit.outcome == 'success' }}
      shell: bash
      env:
        ENVELOPE_PATH: ${{ inputs.workdir }}/${{ inputs.envelope-path }}
        SERVER_ORIGIN: ${{ inputs.elyseum-server }}
        PROJECT_SLUG: ${{ inputs.elyseum-project-slug }}
        INGEST_TOKEN: ${{ inputs.elyseum-ingest-token }}
        STRICT_MODE: ${{ inputs.elyseum-strict-upload }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/scripts/upload-envelope.sh"

    - name: Fail on quality-gate failure
      if: always() && steps.cli.outputs.exit-code != ''
      shell: bash
      env:
        CLI_EXIT_CODE: ${{ steps.cli.outputs.exit-code }}
      run: |
        if [ "$CLI_EXIT_CODE" = "1" ]; then
          echo "::error::Quality gate failed."
          exit 1
        fi
        if [ "$CLI_EXIT_CODE" != "0" ]; then
          echo "::error::elyseum-cli failed with exit code $CLI_EXIT_CODE."
          exit 1
        fi
